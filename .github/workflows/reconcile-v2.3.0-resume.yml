name: Resume v2.3.0 reconciliation

on:
    workflow_run:
        workflows: [Quality]
        types: [completed]
        branches: [main]

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

env:
    RAN_RESUME_PR: '27'
    RAN_SOURCE_RUN: '35268651964'
    RAN_SOURCE_HEAD: c76aadf6c3da3cceb08e36fe777f0d61ccf11b7d
    RAN_HISTORICAL_COMMIT: 48a76148363ea1672b8d93f6e0914d2d37644db5
    RAN_RELEASE_HEAD: 913c70025639fb497d24823e92dca4467ee69196
    RAN_RELEASE_TREE: a37c05b57e68a7543f99c27093844876b6ffd428
    RAN_RELEASE_PR: '10'
    RAN_RELEASE_TAG: v2.3.0
    RAN_RELEASE_VERSION: 2.3.0
    RAN_ARTIFACT_NAME: ran-emailoctopus-v2.3.0-reconciliation-35268651964

jobs:
    admission:
        name: Authenticate exact v2.3.0 resume merge
        if: >-
            ${{ github.event.workflow_run.event == 'push'
                && github.event.workflow_run.conclusion == 'success'
                && github.event.workflow_run.head_branch == 'main'
                && github.event.workflow_run.head_repository.full_name == github.repository
                && github.event.workflow_run.path == '.github/workflows/quality.yml' }}
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        steps:
            - name: Prove the trigger is the exact merged resume PR
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail
                  resume_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_RESUME_PR}")"
                  jq -e \
                    --arg trigger "$RAN_TRIGGER_SHA" \
                    --arg repository "$GITHUB_REPOSITORY" \
                    '.merged == true
                     and .merged_at != null
                     and .state == "closed"
                     and .base.ref == "main"
                     and .merge_commit_sha == $trigger
                     and .head.ref == "fix/reconcile-v2.3.0-historical-plugin-check"
                     and .head.repo.full_name == $repository
                     and .title == "fix(release): resume v2.3.0 historical reconciliation"' \
                    <<< "$resume_pr" >/dev/null

    plugin-check:
        name: Re-qualify historical v2.3.0 Plugin Check
        needs: admission
        if: ${{ needs.admission.result == 'success' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            actions: read
            contents: read
        env:
            PLUGIN_CHECK_CORE_REF: WordPress/WordPress#7.0.3
            PLUGIN_CHECK_SLUG: ran-emailoctopus-jetpack-forms
            PLUGIN_CHECK_VERSION: 2.1.0
            PLUGIN_CHECK_WP_ENV_VERSION: 11.13.0
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false

            - name: Verify exact trusted tooling revision
              run: test "$(git rev-parse HEAD)" = '${{ github.event.workflow_run.head_sha }}'

            - name: Prove the fixed historical qualification run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RAN_SOURCE_RUN}")"
                  jq -e \
                    --arg head "$RAN_SOURCE_HEAD" \
                    '.name == "Reconcile v2.3.0"
                     and .event == "workflow_run"
                     and .head_sha == $head
                     and .run_attempt == 1
                     and .status == "completed"
                     and .conclusion == "failure"' \
                    <<< "$run_json" >/dev/null

                  jobs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RAN_SOURCE_RUN}/jobs?per_page=100")"
                  jq -e '
                    ([.jobs[] | select(.name == "Rebuild exact historical v2.3.0 source" and .conclusion == "success")] | length) == 1
                    and ([.jobs[] | select(.name == "Historical v2.3.0 / PHP 8.0 / WordPress 6.8 / Jetpack 15.5" and .conclusion == "success")] | length) == 1
                    and ([.jobs[] | select(.name == "Historical v2.3.0 / PHP 8.5 / WordPress latest / Jetpack latest" and .conclusion == "success")] | length) == 1
                    and ([.jobs[] | select(.name == "Historical v2.3.0 / Plugin Check" and .conclusion == "failure")] | length) == 1
                    and ([.jobs[] | select(.name == "Publish and read back missing v2.3.0" and .conclusion == "skipped")] | length) == 1
                  ' <<< "$jobs" >/dev/null

            - name: Download the exact qualified historical artifact
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ env.RAN_ARTIFACT_NAME }}
                  path: dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ env.RAN_SOURCE_RUN }}

            - name: Verify exact historical artifact identity
              shell: bash
              run: |
                  set -euo pipefail
                  archive="dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip"
                  checksum="${archive}.sha256"
                  manifest="dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
                  archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
                  jq -e \
                    --arg archive "$(basename "$archive")" \
                    --arg commit "$RAN_HISTORICAL_COMMIT" \
                    --arg sha256 "$archive_sha256" \
                    --arg tag "$RAN_RELEASE_TAG" \
                    --arg version "$RAN_RELEASE_VERSION" \
                    '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
                    "$manifest" >/dev/null
                  printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
                  (cd dist && sha256sum --check --strict "$(basename "$checksum")")
                  unzip -tqq "$archive"

            - name: Extract historical release archive
              run: mkdir plugin-check-build && unzip -q "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" -d plugin-check-build

            - name: Check out the pinned Plugin Check result processor
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: WordPress/plugin-check-action
                  ref: 98a1788320d0add90df2d8183934ecccbc4e05d2
                  path: .plugin-check-action
                  persist-credentials: false

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24'

            - name: Install pinned wp-env runtime
              run: |
                  npm --global --no-fund --no-audit install "@wordpress/env@${PLUGIN_CHECK_WP_ENV_VERSION}"
                  test "$(npm --global list @wordpress/env --depth=0 --json | jq -er '.dependencies["@wordpress/env"].version')" = "$PLUGIN_CHECK_WP_ENV_VERSION"

            - name: Configure pinned WordPress for Plugin Check
              env:
                  PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-emailoctopus-jetpack-forms
              run: |
                  jq -n \
                    --arg core "$PLUGIN_CHECK_CORE_REF" \
                    --arg path "$PLUGIN_DIR" \
                    --arg slug "$PLUGIN_CHECK_SLUG" \
                    '{core: $core, port: 8880, testsEnvironment: false, mappings: {("wp-content/plugins/" + $slug): $path}}' > .wp-env.json
                  test "$(jq -er '.core' .wp-env.json)" = "$PLUGIN_CHECK_CORE_REF"

            - name: Start pinned Plugin Check environment
              timeout-minutes: 10
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                      if wp-env start --update && wp-env run cli wp cli info; then
                          exit 0
                      fi
                      if [[ "$attempt" == 3 ]]; then
                          exit 1
                      fi
                      wp-env destroy --force || true
                  done

            - name: Run Plugin Check
              id: plugin-check-command
              continue-on-error: true
              env:
                  RAW_RESULTS: ${{ runner.temp }}/plugin-check-v230-raw.txt
              run: |
                  set -euo pipefail
                  wp-env run cli wp plugin install plugin-check --version="$PLUGIN_CHECK_VERSION" --activate
                  installed_plugin_check="$(wp-env run cli wp plugin get plugin-check --field=version 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n 1)"
                  test "$installed_plugin_check" = "$PLUGIN_CHECK_VERSION"
                  dependencies="$(wp-env run cli wp plugin get "$PLUGIN_CHECK_SLUG" --field=requires_plugins | tr ',' ' ')"
                  if [[ -n "$dependencies" ]]; then
                      # WordPress owns these dependency slugs; word splitting is intentional.
                      # shellcheck disable=SC2086
                      wp-env run cli wp plugin install --activate $dependencies
                  fi
                  wp-env run cli wp plugin activate "$PLUGIN_CHECK_SLUG"
                  wp-env run cli wp plugin check "$PLUGIN_CHECK_SLUG" \
                    --format=json \
                    --require=./wp-content/plugins/plugin-check/cli.php > "$RAW_RESULTS"
                  cat "$RAW_RESULTS"

            - name: Admit only exact historical Tested up to drift
              env:
                  RAW_RESULTS: ${{ runner.temp }}/plugin-check-v230-raw.txt
                  FILTERED_RESULTS: ${{ runner.temp }}/plugin-check-v230-filtered.txt
                  PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-emailoctopus-jetpack-forms
              run: |
                  set -euo pipefail
                  node scripts/filter-v230-plugin-check-results.mjs "$RAW_RESULTS" "$PLUGIN_DIR" > "$FILTERED_RESULTS"
                  cat "$FILTERED_RESULTS"

            - name: Process filtered Plugin Check results
              env:
                  INPUT_REPO_TOKEN: ${{ github.token }}
                  FILTERED_RESULTS: ${{ runner.temp }}/plugin-check-v230-filtered.txt
                  STRICT: 'false'
              run: |
                  node .plugin-check-action/dist/index.js "$FILTERED_RESULTS"
                  test '${{ steps.plugin-check-command.outcome }}' = success

            - name: Destroy pinned Plugin Check environment
              if: always()
              run: wp-env destroy --force

    publish:
        name: Publish and read back missing v2.3.0
        needs: plugin-check
        if: ${{ needs.plugin-check.result == 'success' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: write
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RAN_TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        steps:
            - name: Download exact qualified historical assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ env.RAN_ARTIFACT_NAME }}
                  path: dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ env.RAN_SOURCE_RUN }}

            - name: Prove PR, commit, tree, manifest, and publication state
              id: identity
              shell: bash
              run: |
                  set -euo pipefail
                  live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                  test "$live_main" = "$RAN_TRIGGER_SHA"

                  release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_RELEASE_PR}")"
                  jq -e \
                    --arg merge "$RAN_HISTORICAL_COMMIT" \
                    --arg head "$RAN_RELEASE_HEAD" \
                    --arg repository "$GITHUB_REPOSITORY" \
                    '.merged_at != null
                     and .base.ref == "main"
                     and .head.sha == $head
                     and .merge_commit_sha == $merge
                     and .head.ref == "release-please--branches--main--components--ran-emailoctopus-jetpack-forms"
                     and .head.repo.full_name == $repository
                     and .user.login == "github-actions[bot]"' \
                    <<< "$release_pr" >/dev/null

                  test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_HISTORICAL_COMMIT}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"
                  test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_RELEASE_HEAD}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"

                  manifest_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${RAN_TRIGGER_SHA}" --jq '.content' | tr -d '\n' | base64 -d | jq -er '.["."]')"
                  test "$manifest_version" = "$RAN_RELEASE_VERSION"

                  archive="dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip"
                  checksum="${archive}.sha256"
                  manifest="dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
                  archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
                  jq -e \
                    --arg archive "$(basename "$archive")" \
                    --arg commit "$RAN_HISTORICAL_COMMIT" \
                    --arg sha256 "$archive_sha256" \
                    --arg tag "$RAN_RELEASE_TAG" \
                    --arg version "$RAN_RELEASE_VERSION" \
                    '.archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
                    "$manifest" >/dev/null
                  printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
                  (cd dist && sha256sum --check --strict "$(basename "$checksum")")
                  unzip -tqq "$archive"

                  expected_names="$(
                      printf '%s\n' \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
                        | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"

                  release_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
                  release_match="$(jq -c --arg tag "$RAN_RELEASE_TAG" '[add | .[] | select(.tag_name == $tag)]' <<< "$release_pages")"
                  tag_match="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${RAN_RELEASE_TAG}" | jq -c --arg ref "refs/tags/${RAN_RELEASE_TAG}" '[.[] | select(.ref == $ref)]')"
                  release_count="$(jq 'length' <<< "$release_match")"
                  tag_count="$(jq 'length' <<< "$tag_match")"

                  if [[ "$tag_count" -eq 0 && "$release_count" -eq 0 ]]; then
                      echo "::error::Exact external tag ${RAN_RELEASE_TAG} is required at ${RAN_HISTORICAL_COMMIT} before publication."
                      exit 1
                  fi
                  if [[ "$tag_count" -ne 1 ]]; then
                      echo "::error::Expected exactly one ${RAN_RELEASE_TAG} tag."
                      exit 1
                  fi

                  tag_json="$(jq -cer '.[0]' <<< "$tag_match")"
                  jq -e --arg commit "$RAN_HISTORICAL_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_json" >/dev/null

                  if [[ "$release_count" -eq 0 ]]; then
                      state=tagged
                  elif [[ "$release_count" -eq 1 ]]; then
                      release_json="$(jq -cer '.[0]' <<< "$release_match")"
                      jq -e \
                        --arg tag "$RAN_RELEASE_TAG" \
                        --arg commit "$RAN_HISTORICAL_COMMIT" \
                        '.tag_name == $tag and .target_commitish == $commit and .prerelease == false' \
                        <<< "$release_json" >/dev/null

                      asset_names="$(jq -c '[.assets[].name]' <<< "$release_json")"
                      test "$(jq 'length' <<< "$asset_names")" = "$(jq 'unique | length' <<< "$asset_names")"
                      test "$(jq -c --argjson expected "$expected_names" '[.[] | select(. as $name | $expected | index($name) | not)]' <<< "$asset_names")" = '[]'

                      release_id="$(jq -er '.id' <<< "$release_json")"
                      echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
                      if [[ "$(jq -er '.draft' <<< "$release_json")" == true ]]; then
                          state=draft
                      else
                          state=published
                      fi
                  else
                      echo "::error::Expected at most one ${RAN_RELEASE_TAG} release."
                      exit 1
                  fi

                  labels="$(jq -c '[.labels[].name]' <<< "$release_pr")"
                  pending="$(jq -r 'index("autorelease: pending") != null' <<< "$labels")"
                  tagged="$(jq -r 'index("autorelease: tagged") != null' <<< "$labels")"
                  case "$state" in
                      tagged|draft)
                          test "$pending" = true
                          test "$tagged" = false
                          ;;
                      published)
                          if [[ "$pending" != true && "$tagged" != true ]]; then
                              echo "::error::Published v2.3.0 PR has neither Release Please lifecycle label."
                              exit 1
                          fi
                          ;;
                  esac

                  echo "state=$state" >> "$GITHUB_OUTPUT"

            - name: Create exact draft release for the pre-authorized tag
              id: draft
              if: steps.identity.outputs.state == 'tagged'
              shell: bash
              run: |
                  set -euo pipefail
                  jq -nc \
                    --arg tag "$RAN_RELEASE_TAG" \
                    --arg commit "$RAN_HISTORICAL_COMMIT" \
                    '{tag_name: $tag, target_commitish: $commit, name: $tag, draft: true, prerelease: false, generate_release_notes: true}' \
                    | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - > "$RUNNER_TEMP/release.json"
                  release_id="$(jq -er '.id' "$RUNNER_TEMP/release.json")"
                  jq -e \
                    --arg tag "$RAN_RELEASE_TAG" \
                    --arg commit "$RAN_HISTORICAL_COMMIT" \
                    '.tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false' \
                    "$RUNNER_TEMP/release.json" >/dev/null
                  echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

            - name: Synchronize exact qualified assets into the verified draft
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              shell: bash
              env:
                  RELEASE_ID: ${{ steps.identity.outputs.release-id || steps.draft.outputs.release-id }}
              run: |
                  set -euo pipefail
                  test -n "$RELEASE_ID"
                  for asset in \
                    "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                    "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
                    "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json"
                  do
                      asset_name="$(basename "$asset")"
                      local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
                      release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
                      matches="$(jq -c --arg name "$asset_name" '[.assets[] | select(.name == $name)]' <<< "$release_json")"
                      match_count="$(jq 'length' <<< "$matches")"
                      if [[ "$match_count" -gt 1 ]]; then
                          echo "::error::Duplicate draft asset name: ${asset_name}"
                          exit 1
                      fi
                      if [[ "$match_count" -eq 1 ]]; then
                          remote_digest="$(jq -er '.[0].digest' <<< "$matches")"
                          if [[ "$remote_digest" == "$local_digest" ]]; then
                              continue
                          fi
                          existing_asset_id="$(jq -er '.[0].id' <<< "$matches")"
                          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
                      fi

                      case "$asset_name" in
                          *.zip) content_type='application/zip' ;;
                          *.json) content_type='application/json' ;;
                          *) content_type='application/octet-stream' ;;
                      esac
                      curl --fail-with-body --silent --show-error \
                        -X POST \
                        -H "Authorization: Bearer ${GH_TOKEN}" \
                        -H 'X-GitHub-Api-Version: 2026-03-10' \
                        -H "Content-Type: ${content_type}" \
                        --data-binary "@${asset}" \
                        "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}" \
                        >/dev/null
                  done

            - name: Verify the complete exact draft before publication
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              shell: bash
              env:
                  RELEASE_ID: ${{ steps.identity.outputs.release-id || steps.draft.outputs.release-id }}
              run: |
                  set -euo pipefail
                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
                  jq -e \
                    --argjson release_id "$RELEASE_ID" \
                    --arg tag "$RAN_RELEASE_TAG" \
                    --arg commit "$RAN_HISTORICAL_COMMIT" \
                    '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false' \
                    <<< "$release_json" >/dev/null

                  expected_names="$(
                      printf '%s\n' \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
                        | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"
                  test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected_names"

                  local_digests="$(
                      for asset in \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256"
                      do
                          jq -nc \
                            --arg name "$(basename "$asset")" \
                            --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" \
                            '{name: $name, digest: $digest}'
                      done | jq -sc 'sort_by(.name)'
                  )"
                  remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                  test "$remote_digests" = "$local_digests"

            - name: Publish exact reconciled release
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              env:
                  RELEASE_ID: ${{ steps.identity.outputs.release-id || steps.draft.outputs.release-id }}
              run: |
                  set -euo pipefail
                  jq -nc '{draft: false, prerelease: false, make_latest: "true"}' \
                    | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null

            - name: Read back exact tag, release, assets, and digests
              shell: bash
              env:
                  RELEASE_ID: ${{ steps.identity.outputs.release-id || steps.draft.outputs.release-id }}
              run: |
                  set -euo pipefail
                  test -n "$RELEASE_ID"
                  expected_names="$(
                      printf '%s\n' \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                        "ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256" \
                        | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"
                  local_digests="$(
                      for asset in \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.manifest.json" \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip" \
                        "dist/ran-emailoctopus-jetpack-forms-${RAN_RELEASE_VERSION}.zip.sha256"
                      do
                          jq -nc \
                            --arg name "$(basename "$asset")" \
                            --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" \
                            '{name: $name, digest: $digest}'
                      done | jq -sc 'sort_by(.name)'
                  )"

                  verified=false
                  for attempt in 1 2 3; do
                      if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")" \
                        && tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"; then
                          if jq -e \
                            --argjson release_id "$RELEASE_ID" \
                            --arg tag "$RAN_RELEASE_TAG" \
                            --arg commit "$RAN_HISTORICAL_COMMIT" \
                            '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
                            <<< "$release_json" >/dev/null \
                            && jq -e --arg commit "$RAN_HISTORICAL_COMMIT" '.object.type == "commit" and .object.sha == $commit' <<< "$tag_ref" >/dev/null; then
                              actual_names="$(jq -c '[.assets[].name] | sort' <<< "$release_json")"
                              remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                              if [[ "$actual_names" == "$expected_names" && "$remote_digests" == "$local_digests" ]]; then
                                  verified=true
                                  break
                              fi
                          fi
                      fi
                      [[ "$attempt" -lt 3 ]] && sleep 2
                  done

                  if [[ "$verified" != true ]]; then
                      echo '::error::Published v2.3.0 readback did not converge to the qualified provenance.'
                      exit 1
                  fi

            - name: Reconcile Release Please PR labels only after exact publication readback
              shell: bash
              run: |
                  set -euo pipefail
                  labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}" --jq '[.labels[].name]')"
                  if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
                      jq -nc '{labels: ["autorelease: tagged"]}' \
                        | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels" --input - >/dev/null
                  fi
                  if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
                      gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels/autorelease%3A%20pending" >/dev/null
                  fi
