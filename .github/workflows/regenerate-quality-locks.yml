name: Verify migrated quality profile

on:
  push:
    branches:
      - chore/adopt-shared-quality-profile-v2
    paths:
      - composer.json
      - package.json
      - phpcs.xml.dist
      - eslint.config.mjs
      - .stylelintrc.json
      - prettier.config.cjs
      - .prettierignore
      - scripts/lint-sources.mjs
      - .github/workflows/regenerate-quality-locks.yml

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.5.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json

      - name: Regenerate locked dependency graphs
        run: |
          composer update --no-interaction --prefer-dist --no-progress
          pnpm install --no-frozen-lockfile

      - name: Verify migrated quality contracts
        run: |
          composer check
          pnpm check
          pnpm check:generated

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: regenerated-quality-locks
          path: |
            composer.lock
            pnpm-lock.yaml
          if-no-files-found: error
