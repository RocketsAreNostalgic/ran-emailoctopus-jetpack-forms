name: Quality

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    baseline:
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d # accepted quality-v1 provider
        with:
            php-version: '8.3'
            pnpm-version: '11.5.2'

    quality:
        name: Quality and release artifact
        runs-on: blacksmith-2vcpu-ubuntu-2404
        env:
            RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        outputs:
            artifact-name: ${{ steps.release.outputs.artifact-name }}
            matrix: ${{ steps.release.outputs.matrix }}
            source-sha: ${{ steps.release.outputs.source-sha }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ env.RAN_SOURCE_SHA }}

            - name: Verify exact source checkout
              shell: bash
              run: test "$(git rev-parse HEAD)" = "$RAN_SOURCE_SHA"

            # Blacksmith PHP provisioning can stall upstream. Keep both attempts
            # within one five-minute budget; the retry uses the same runner.
            - name: Set up PHP (bounded first attempt)
              id: php
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              continue-on-error: true
              timeout-minutes: 2
              with:
                  php-version: '8.3'
                  coverage: none
                  extensions: zip
                  tools: composer:v2, wp-cli

            - name: Retry PHP setup once
              if: steps.php.outcome == 'failure'
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              timeout-minutes: 3
              with:
                  php-version: '8.3'
                  coverage: none
                  extensions: zip
                  tools: composer:v2, wp-cli

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install development dependencies
              run: |
                  pnpm install --frozen-lockfile
                  composer install --no-interaction --prefer-dist --no-progress

            - name: Run cheap source and generated-file gates
              run: |
                  pnpm check
                  pnpm check:generated
                  composer check
                  fake_bin="$(mktemp -d)"
                  printf '#!/usr/bin/env sh\nexit 42\n' > "$fake_bin/find"
                  chmod +x "$fake_bin/find"
                  if PATH="$fake_bin:$PATH" composer lint:syntax; then
                      echo '::error::PHP syntax discovery failure was incorrectly accepted.'
                      rm -rf "$fake_bin"
                      exit 1
                  fi
                  rm -rf "$fake_bin"
                  grep -Fq 'tools: composer:v2, wp-cli' .github/workflows/quality.yml
                  jq -e '.draft == true and .["force-tag-creation"] == true and .["skip-github-release"] != true' release-please-config.json >/dev/null
                  grep -Fq 'release-profile-b.yml@e2fb19244a301a62f8fae2a80536898adf21fe22' .github/workflows/release-please.yml
                  grep -Fq 'artifact-prefix: ran-emailoctopus-jetpack-forms-release' .github/workflows/release-please.yml
                  test ! -e .github/workflows/release-publisher.yml
                  grep -Fq 'workflows: [Release Please]' .github/workflows/deploy-wordpress-org.yml
                  grep -Fq 'environment: wordpress-org' .github/workflows/deploy-wordpress-org.yml
                  jq -e '(.enabled | type == "boolean") and (.syncListingAssets | type == "boolean")' wordpress-org/deployment.json >/dev/null
                  if grep -Fq 'workflow_dispatch:' .github/workflows/deploy-wordpress-org.yml; then
                      echo '::error::WordPress.org deployment must not regain a manual bypass.'
                      exit 1
                  fi
                  if grep -Fq -- '--allow-disabled' scripts/deploy-wordpress-org.sh; then
                      echo '::error::Disabled WordPress.org deployment must not be bypassable.'
                      exit 1
                  fi
                  grep -Fq 'ran-profile-b-promotion.json' .github/workflows/quality.yml

            - name: Build and verify the canonical release assets once
              id: release
              shell: bash
              env:
                  RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  RAN_PR_BASE: ${{ github.event.pull_request.base.ref }}
                  RAN_PR_HEAD: ${{ github.event.pull_request.head.ref }}
                  RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
              run: |
                  set -euo pipefail
                  version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-emailoctopus-jetpack-forms.php)"
                  test -n "$version"
                  bash scripts/create-release-assets.sh "v${version}"

                  source_commit="$(git rev-parse HEAD)"
                  test "$source_commit" = "$RAN_SOURCE_SHA"
                  archive="dist/ran-emailoctopus-jetpack-forms-${version}.zip"
                  checksum="${archive}.sha256"
                  archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
                  checksum_sha256="$(sha256sum "$checksum" | awk '{ print $1 }')"
                  test "$(< "$checksum")" = "$(printf '%s  %s' "$archive_sha256" "$(basename "$archive")")"
                  jq -n \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --arg quality_commit "$source_commit" \
                      --arg source_commit "$source_commit" \
                      --arg tag "v${version}" \
                      --arg archive_name "$(basename "$archive")" \
                      --arg archive_sha256 "$archive_sha256" \
                      --arg checksum_name "$(basename "$checksum")" \
                      --arg checksum_sha256 "$checksum_sha256" \
                      '{
                          schema: "ran-profile-b-promotion",
                          schema_version: 1,
                          repository: $repository,
                          quality_commit: $quality_commit,
                          source_commit: $source_commit,
                          tag: $tag,
                          assets: [
                              {name: $archive_name, sha256: $archive_sha256},
                              {name: $checksum_name, sha256: $checksum_sha256}
                          ]
                      }' > dist/ran-profile-b-promotion.json

                  release_candidate=false
                  if [[ "$GITHUB_EVENT_NAME" == pull_request \
                      && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
                      && "$RAN_PR_BASE" == main \
                      && "$RAN_PR_HEAD" == 'release-please--branches--main--components--ran-emailoctopus-jetpack-forms' \
                      && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                      release_candidate=true
                  elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch \
                      && "$GITHUB_REF_NAME" == 'release-please--branches--main--components--ran-emailoctopus-jetpack-forms' ]]; then
                      release_candidate=true
                  fi

                  if [[ "$release_candidate" == true ]]; then
                      matrix='{"include":[{"php":"8.5","wordpress":"latest","jetpack":"latest"}]}'
                  else
                      matrix='{"include":[{"php":"8.0","wordpress":"6.8","jetpack":"15.5"},{"php":"8.5","wordpress":"latest","jetpack":"latest"}]}'
                  fi

                  {
                      printf 'artifact-name=ran-emailoctopus-jetpack-forms-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
                      printf 'matrix=%s\n' "$matrix"
                      printf 'source-sha=%s\n' "$source_commit"
                      printf 'version=%s\n' "$version"
                  } >> "$GITHUB_OUTPUT"

            - name: Upload the verified release assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.release.outputs.artifact-name }}
                  path: |
                      dist/ran-emailoctopus-jetpack-forms-${{ steps.release.outputs.version }}.zip
                      dist/ran-emailoctopus-jetpack-forms-${{ steps.release.outputs.version }}.zip.sha256
                      dist/ran-emailoctopus-jetpack-forms-${{ steps.release.outputs.version }}.manifest.json
                      dist/ran-profile-b-promotion.json
                  if-no-files-found: error
                  retention-days: 7

    compatibility:
        name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }} / Jetpack ${{ matrix.jetpack }}
        needs: quality
        runs-on: blacksmith-2vcpu-ubuntu-2404
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ needs.quality.outputs.source-sha }}

            - name: Verify exact source checkout
              shell: bash
              run: test "$(git rev-parse HEAD)" = '${{ needs.quality.outputs.source-sha }}'

            - name: Set up PHP (bounded first attempt)
              id: php
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              continue-on-error: true
              timeout-minutes: 2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - name: Retry PHP setup once
              if: steps.php.outcome == 'failure'
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              timeout-minutes: 3
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - run: composer install --no-interaction --prefer-dist --no-progress

            - name: Download the canonical release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.quality.outputs.artifact-name }}
                  path: dist

            - name: Verify the shared archive identity
              shell: bash
              run: |
                  set -euo pipefail
                  archive="dist/ran-emailoctopus-jetpack-forms-${{ needs.quality.outputs.version }}.zip"
                  manifest="dist/ran-emailoctopus-jetpack-forms-${{ needs.quality.outputs.version }}.manifest.json"
                  test "$(jq -er '.commit' "$manifest")" = '${{ needs.quality.outputs.source-sha }}'
                  test "$(jq -er '.version' "$manifest")" = '${{ needs.quality.outputs.version }}'
                  (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
                  unzip -tqq "$archive"

            - name: Install WordPress test suite
              run: bash scripts/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress }}

            - run: WP_TESTS_DIR=/tmp/wordpress-tests-lib composer test:integration

            - name: Install and activate the shared release ZIP in fresh WordPress
              run: |
                  fresh_root=/tmp/ran-emailoctopus-jetpack-forms-release-wordpress
                  wp_version='${{ matrix.wordpress }}'
                  if [[ "$wp_version" == latest ]]; then
                      wp core download --path="$fresh_root"
                  else
                      wp core download --path="$fresh_root" --version="$wp_version"
                  fi
                  wp config create --path="$fresh_root" --dbname=ran_emailoctopus_jetpack_forms_release --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
                  wp db create --path="$fresh_root"
                  wp core install --path="$fresh_root" --url=http://localhost --title='RAN release test' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
                  jetpack_version='${{ matrix.jetpack }}'
                  if [[ "$jetpack_version" == latest ]]; then
                      wp plugin install jetpack --path="$fresh_root" --activate
                  else
                      wp plugin install jetpack --version="$jetpack_version" --path="$fresh_root" --activate
                  fi
                  wp plugin install "$GITHUB_WORKSPACE/dist/ran-emailoctopus-jetpack-forms-${{ needs.quality.outputs.version }}.zip" --path="$fresh_root" --activate
                  wp plugin is-active ran-emailoctopus-jetpack-forms --path="$fresh_root"
                  wp eval-file "$GITHUB_WORKSPACE/scripts/smoke-saved-form.php" --path="$fresh_root"

    plugin-check:
        name: Plugin Check
        needs: quality
        runs-on: blacksmith-2vcpu-ubuntu-2404
        env:
            PLUGIN_CHECK_CORE_REF: WordPress/WordPress#7.0.3
            PLUGIN_CHECK_SLUG: ran-emailoctopus-jetpack-forms
            PLUGIN_CHECK_WP_ENV_VERSION: 11.13.0
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ needs.quality.outputs.source-sha }}

            - name: Verify exact source checkout
              shell: bash
              run: test "$(git rev-parse HEAD)" = '${{ needs.quality.outputs.source-sha }}'

            - name: Download the canonical release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.quality.outputs.artifact-name }}
                  path: dist

            - name: Extract the tested archive
              run: mkdir plugin-check-build && unzip -q "dist/ran-emailoctopus-jetpack-forms-${{ needs.quality.outputs.version }}.zip" -d plugin-check-build

            # WordPress.org can advertise a release before its matching Git mirror
            # tag exists. Pin both wp-env and Core so Plugin Check remains releasable
            # during that propagation window.
            - name: Check out the pinned Plugin Check result processor
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: WordPress/plugin-check-action
                  ref: 98a1788320d0add90df2d8183934ecccbc4e05d2
                  path: .plugin-check-action
                  persist-credentials: false

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24'

            - name: Install the pinned wp-env runtime
              run: |
                  npm --global --no-fund --no-audit install "@wordpress/env@${PLUGIN_CHECK_WP_ENV_VERSION}"
                  test "$(npm --global list @wordpress/env --depth=0 --json | jq -er '.dependencies["@wordpress/env"].version')" = "$PLUGIN_CHECK_WP_ENV_VERSION"

            - name: Configure WordPress 7.0.3 for Plugin Check
              env:
                  PLUGIN_DIR: ${{ github.workspace }}/plugin-check-build/ran-emailoctopus-jetpack-forms
              run: |
                  jq -n \
                    --arg core "$PLUGIN_CHECK_CORE_REF" \
                    --arg path "$PLUGIN_DIR" \
                    --arg slug "$PLUGIN_CHECK_SLUG" \
                    '{core: $core, port: 8880, testsEnvironment: false, mappings: {("wp-content/plugins/" + $slug): $path}}' > .wp-env.json
                  test "$(jq -er '.core' .wp-env.json)" = "$PLUGIN_CHECK_CORE_REF"

            - name: Start the pinned Plugin Check environment
              timeout-minutes: 10
              run: |
                  set -euo pipefail
                  for attempt in 1 2 3; do
                      if wp-env start --update && wp-env run cli wp cli info; then
                          exit 0
                      fi
                      if [[ "$attempt" == 3 ]]; then
                          exit 1
                      fi
                      wp-env destroy --force || true
                  done

            - name: Run Plugin Check
              id: plugin-check
              continue-on-error: true
              env:
                  RESULTS_FILE: ${{ runner.temp }}/plugin-check-results.txt
              run: |
                  set -euo pipefail
                  wp-env run cli wp plugin install plugin-check --activate
                  dependencies="$(wp-env run cli wp plugin get "$PLUGIN_CHECK_SLUG" --field=requires_plugins | tr ',' ' ')"
                  if [[ -n "$dependencies" ]]; then
                      # WordPress owns these dependency slugs; word splitting is intentional.
                      # shellcheck disable=SC2086
                      wp-env run cli wp plugin install --activate $dependencies
                  fi
                  wp-env run cli wp plugin activate "$PLUGIN_CHECK_SLUG"
                  wp-env run cli wp plugin check "$PLUGIN_CHECK_SLUG" \
                    --format=json \
                    --require=./wp-content/plugins/plugin-check/cli.php > "$RESULTS_FILE"
                  cat "$RESULTS_FILE"

            - name: Process Plugin Check results
              if: always()
              env:
                  INPUT_REPO_TOKEN: ${{ github.token }}
                  RESULTS_FILE: ${{ runner.temp }}/plugin-check-results.txt
                  STRICT: 'false'
              run: |
                  node .plugin-check-action/dist/index.js "$RESULTS_FILE"
                  test '${{ steps.plugin-check.outcome }}' = success

            - name: Upload Plugin Check results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: plugin-check-results
                  path: ${{ runner.temp }}/plugin-check-results.txt
                  if-no-files-found: ignore

            - name: Destroy the pinned Plugin Check environment
              if: always()
              run: wp-env destroy --force

    quality-gate:
        name: quality
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && always() }}
        needs:
            - baseline
            - quality
            - compatibility
            - plugin-check
        runs-on: ubuntu-latest
        steps:
            - name: Require all ordinary quality lanes
              env:
                  BASELINE_RESULT: ${{ needs.baseline.result }}
                  SOURCE_RESULT: ${{ needs.quality.result }}
                  COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
                  PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
              run: |
                  printf 'baseline=%s\nsource=%s\ncompatibility=%s\nplugin-check=%s\n' \
                    "$BASELINE_RESULT" "$SOURCE_RESULT" "$COMPATIBILITY_RESULT" "$PLUGIN_CHECK_RESULT"
                  if [ "$BASELINE_RESULT" != success ] \
                    || [ "$SOURCE_RESULT" != success ] \
                    || [ "$COMPATIBILITY_RESULT" != success ] \
                    || [ "$PLUGIN_CHECK_RESULT" != success ]; then
                      exit 1
                  fi
